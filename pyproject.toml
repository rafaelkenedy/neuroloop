[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroloop"
version = "0.0.1"
description = "Runtime de agente cognitivo controlado por estado, políticas, memória e verificação"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.20",
    "fastapi>=0.115",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.116",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuroloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tests/benchmarks"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "benchmark: cenários B1–B5 (spec §30); mais lentos que a suíte comum",
]
filterwarnings = [
    "error",
    # SQLite não tem tipo decimal nativo; em produção o alvo é PostgreSQL.
    "ignore:.*does \\*not\\* support Decimal objects natively.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
