services:
  postgres:
    image: postgres:17-alpine
    container_name: neuroloop-postgres
    environment:
      POSTGRES_USER: neuroloop
      POSTGRES_PASSWORD: neuroloop
      POSTGRES_DB: neuroloop
    ports:
      - "5432:5432"
    volumes:
      - neuroloop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroloop -d neuroloop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neuroloop-pgdata:
